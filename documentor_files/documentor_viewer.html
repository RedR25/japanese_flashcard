<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>source - Documentation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" id="hljs-dark">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" id="hljs-light" disabled>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #f87171;
        }
        
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #475569;
            --text-faint: #64748b;
            --accent: #2563eb;
            --accent-light: #3b82f6;
            --border: #e2e8f0;
            --error: #dc2626;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-secondary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        .sidebar {
            width: 300px;
            min-width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .sidebar-header-left h1 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }
        
        .sidebar-meta {
            font-size: 0.75rem;
            color: var(--text-faint);
        }
        
        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.375rem;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .theme-toggle:hover {
            color: var(--text-primary);
            border-color: var(--accent);
        }
        
        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }
        
        .icon-sun, .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: block; }
        [data-theme="light"] .icon-moon { display: block; }
        
        .search {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .search input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }
        
        .search input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .search input::placeholder {
            color: var(--text-faint);
        }
        
        .nav-tree {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.5rem 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .nav-tree::-webkit-scrollbar {
            width: 6px;
        }

        .nav-tree::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-tree::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .nav-tree::-webkit-scrollbar-thumb:hover {
            background: var(--text-faint);
        }

        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-primary);
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .content-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .content-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .content-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--text-faint);
        }


        .nav-file, .nav-readme, .nav-summary, .nav-changes {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8125rem;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: all 0.15s;
        }

        .nav-file:hover, .nav-readme:hover, .nav-summary:hover, .nav-changes:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-file.active, .nav-readme.active, .nav-summary.active {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            border-left-color: var(--accent);
        }

        .nav-readme {
            color: var(--accent-light);
            font-weight: 500;
        }

        .nav-summary {
            color: var(--success);
            font-weight: 600;
        }

        .nav-summary .summary-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .nav-changes {
            color: var(--warning);
            font-weight: 500;
        }

        .nav-changes.active {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border-left-color: var(--warning);
        }

        .badge-added { color: #22c55e; font-size: 0.7em; margin-left: 4px; font-weight: 600; }
        .badge-modified { color: var(--warning); font-size: 0.7em; margin-left: 4px; font-weight: 600; }
        .badge-removed { color: #ef4444; font-size: 0.7em; margin-left: 4px; font-weight: 600; }

        .nav-separator {
            height: 1px;
            background: var(--border);
            margin: 0.5rem 1rem;
        }
        
        .nav-folder {
            margin: 0.0625rem 0;
        }
        
        .nav-folder-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .nav-folder-name:hover {
            background: var(--bg-tertiary);
        }
        
        .folder-icon {
            width: 14px;
            height: 14px;
            fill: var(--text-faint);
            flex-shrink: 0;
        }
        
        .nav-folder.collapsed .nav-folder-name {
            font-weight: 400;
            color: var(--text-muted);
        }
        
        .nav-folder.collapsed .nav-folder-content {
            display: none;
        }
        
        .nav-folder-content {
            margin-left: 0.5rem;
            padding-left: 0.75rem;
            border-left: 1px solid var(--border);
        }
        
        .content {
            margin: 0;
            padding: 2.5rem 3rem;
        }
        
        .content h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .content h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 2.5rem 0 1rem;
        }
        
        .content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 2rem 0 0.75rem;
        }
        
        .content h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 1.5rem 0 0.5rem;
        }
        
        .content p {
            line-height: 1.75;
            margin: 1rem 0;
        }
        
        .content a {
            color: var(--accent-light);
            text-decoration: none;
        }
        
        .content a:hover {
            text-decoration: underline;
        }
        
        .content code {
            background: var(--bg-tertiary);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.875em;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }
        
        .content pre {
            background: var(--bg-secondary);
            padding: 1rem 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.25rem 0;
            border: 1px solid var(--border);
        }
        
        .content pre code {
            background: none;
            padding: 0;
            font-size: 0.8125rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        /* Highlight.js token overrides for better contrast */
        .hljs-string { color: #a5d6ff; }
        .hljs-number { color: #79c0ff; }
        .hljs-keyword { color: #ff7b72; }
        .hljs-built_in { color: #ffa657; }
        .hljs-function { color: #d2a8ff; }
        .hljs-comment { color: #8b949e; }
        .hljs-attr { color: #79c0ff; }
        .hljs-variable { color: #ffa657; }

        .content ul, .content ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }
        
        .content li {
            margin: 0.5rem 0;
            line-height: 1.65;
        }
        
        .content blockquote {
            border-left: 4px solid var(--accent);
            padding: 0.5rem 0 0.5rem 1rem;
            margin: 1.25rem 0;
            color: var(--text-muted);
            background: rgba(59, 130, 246, 0.05);
            border-radius: 0 8px 8px 0;
        }
        
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.25rem 0;
            font-size: 0.875rem;
        }
        
        .content th, .content td {
            padding: 0.75rem 1rem;
            text-align: left;
            border: 1px solid var(--border);
        }
        
        .content th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .content tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }
        
        .content img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        .content .mermaid {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1.25rem 0;
        }
        
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-faint);
        }
        
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: var(--error);
            padding: 2rem;
            text-align: center;
        }
        
        .sidebar-footer {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
        }
        
        .sidebar-footer a {
            color: var(--text-faint);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .sidebar-footer a:hover {
            color: var(--text-muted);
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 260px;
                min-width: 260px;
            }
            .content {
                padding: 1.5rem;
            }
        }
    </style>
</head>

    <div class="content-wrapper">

    <script>
        marked.setOptions({
            gfm: true,
            breaks: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });
        
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose'
        });
        
        let currentPath = null;
        
        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('docs-theme', newTheme);
            
            document.getElementById('hljs-dark').disabled = !isDark;
            document.getElementById('hljs-light').disabled = isDark;
        }
        
        function loadSavedTheme() {
            const saved = localStorage.getItem('docs-theme');
            if (saved) {
                document.body.setAttribute('data-theme', saved);
                document.getElementById('hljs-dark').disabled = saved === 'light';
                document.getElementById('hljs-light').disabled = saved === 'dark';
            }
        }
        
        function resolvePath(href) {
            if (!currentPath) return href;
            if (href.startsWith('/') || href.startsWith('http')) return null;
            
            const currentDir = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
            const parts = (currentDir + href).split('/');
            const resolved = [];
            
            for (const part of parts) {
                if (part === '..') resolved.pop();
                else if (part && part !== '.') resolved.push(part);
            }
            
            return resolved.join('/');
        }
        
        async function loadFile(path) {
            if (currentPath === path) return;
            currentPath = path;
            
            document.querySelectorAll('.sidebar a').forEach(a => 
                a.classList.toggle('active', a.dataset.path === path));
            
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div>Loading...</div></div>';
            
            try {
                const response = await fetch('../' + path);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const markdown = await response.text();
                content.innerHTML = marked.parse(markdown);
                
                content.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
                
                const mermaidBlocks = content.querySelectorAll('pre code.language-mermaid');
                mermaidBlocks.forEach((block, i) => {
                    const pre = block.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = block.textContent;
                    pre.replaceWith(div);
                });
                
                if (mermaidBlocks.length > 0) {
                    await mermaid.run();
                }
                
                content.querySelectorAll('a[href]').forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && href.endsWith('.md') && !href.startsWith('http')) {
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            const resolved = resolvePath(href);
                            if (resolved) loadFile(resolved);
                        });
                    }
                });
                
                document.querySelector('.content-wrapper').scrollTo(0, 0);
                
            } catch (error) {
                content.innerHTML = `<div class="error">
                    <h2>Failed to load file</h2>
                    <p>${error.message}</p>
                    <p style="margin-top:1rem;color:var(--text-faint)">
                        Make sure you're running a local server.<br>
                        Run <code>./serve.sh</code> or <code>serve.bat</code>
                    </p>
                </div>`;
            }
        }
        
        function toggleFolder(el) {
            el.parentElement.classList.toggle('collapsed');
        }
        
        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();

            document.querySelectorAll('.nav-file, .nav-readme, .nav-summary, .nav-changes').forEach(a => {
                const text = a.textContent.toLowerCase();
                const path = (a.dataset.path || '').toLowerCase();
                const match = !query || text.includes(query) || path.includes(query);
                a.style.display = match ? '' : 'none';
            });

            document.querySelectorAll('.nav-folder').forEach(folder => {
                const hasVisible = folder.querySelector(
                    '.nav-file:not([style*="display: none"]), .nav-readme:not([style*="display: none"]), .nav-folder:not([style*="display: none"])'
                );
                folder.style.display = hasVisible ? '' : 'none';
                if (query && hasVisible) {
                    folder.classList.remove('collapsed');
                }
            });
        });
        
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey && e.key === 'k') || (e.key === '/' && document.activeElement.tagName !== 'INPUT')) {
                e.preventDefault();
                document.getElementById('search').focus();
            }
        });
        
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedTheme();
            // Try to load Project Summary first, fall back to README.md
            const summary = document.querySelector('[data-path$="README_SUMMARY.md"]');
            const readme = document.querySelector('[data-path="README.md"]');
            if (summary) {
                summary.click();
            } else if (readme) {
                readme.click();
            }
        });
    </script>
